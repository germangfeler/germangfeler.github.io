name: Probar build de GitHub Pages
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          verbose: true
      - name: Revisar el sitio generado
        shell: python
        run: |
          import os, re, glob, urllib.parse
          os.chdir('_site')
          def n(path, pat): return len(re.findall(pat, open(path, encoding='utf-8').read()))
          need = ['index.html','publicaciones/index.html','cv/index.html','servicios/index.html','tags/index.html',
                  'cafe/index.html','datascience/index.html','bioinformatica/index.html','datascience/shape-of-you/index.html',
                  'cafe/peron-y-ciencia/index.html','cursos/index.html','feed.xml','sitemap.xml','assets/css/main.css','assets/js/site.js']
          for f in need:
              if not os.path.exists(f): print(f'::error::Falta {f}')
          html = glob.glob('**/*.html', recursive=True)
          bad = [f for f in html if re.search(r'Liquid (error|syntax|warning)', open(f, encoding='utf-8').read())]
          for f in bad: print(f'::error::Error de Liquid en {f}')
          broken = set()
          for f in html:
              for u in re.findall(r'(?:src|href)="(/[^"#?]*)', open(f, encoding='utf-8').read()):
                  p = '.' + urllib.parse.unquote(u)
                  if p.endswith('/'): p += 'index.html'
                  if not os.path.exists(p): broken.add(f'{u} (en {f})')
          for b in sorted(broken)[:20]: print(f'::warning::Link roto {b}')
          t = re.search(r'<title>([^<]*)', open('cafe/peron-y-ciencia/index.html', encoding='utf-8').read()).group(1)
          mins = re.findall(r'(\d+) min de lectura', open('index.html', encoding='utf-8').read())[:4]
          print('::notice::' + '; '.join([
              f'paginas html={len(html)}', f'entradas home={n("index.html", "class=\"entry\"")}',
              f'publicaciones={n("publicaciones/index.html", "class=\"pub\"")}', f'chips tecnica={n("publicaciones/index.html", "class=\"tchip")}',
              f'stats cv={n("cv/index.html", "class=\"stat\"")}', f'servicios={n("servicios/index.html", "class=\"service\"")}',
              f'grupos tags={n("tags/index.html", "class=\"tag-group\"")}', f'links rotos={len(broken)}', f'errores liquid={len(bad)}',
              f'minutos={mins}', f'titulo peron={t}', f'disqus={n("datascience/shape-of-you/index.html", "disqus_thread")}']))
