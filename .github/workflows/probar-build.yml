name: Probar build de GitHub Pages
on:
  push:
    branches: [tabla-reforma]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Revisar la tabla
        shell: python
        run: |
          import re
          h = open('_site/cafe/reforma-impositiva/index.html', encoding='utf-8').read()
          i = h.find('class="tr"')
          print('::notice::' + '; '.join([
            f'tabla={h.count("tr__table")}', f'filas={h.count("class=\"tr__tax\"")}', f'fichas={h.count("tr__card ")}',
            f'pestanas={h.count("role=\"tab\"")}', f'sin cambios={h.count("tr__sc")}', f'iconos={h.count("icon--line")}',
            f'pre_code={len(re.findall(r"<pre><code>[^<]*tr__", h))}', f'p_envolviendo={h.count("<p><div class=\"tr\"")}',
            f'og_image={"tabla-propuestas.png" in h}', f'css_v={bool(re.search(r"main.css\?v=\d+", h))}',
            f'inicio={h[i-20:i+30]!r}']))
