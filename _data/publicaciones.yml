# Publicaciones seleccionadas: trabajos donde hice el análisis de datos.
# Se muestran en /publicaciones/ en este orden.
#
# Campos:
#   titulo, autores (tu nombre entre ** ** para resaltarlo), revista, detalle (volumen, páginas),
#   anio, estado (opcional, ej. "En prensa"), doi (opcional, ej. "10.1016/j.marpolbul.2025.118111"),
#   temas: de qué trata el trabajo
#   aporte: técnicas que apliqué. Usá siempre el mismo nombre para la misma técnica,
#           así el filtro las agrupa (ej. "Linear mixed models", no "LME models").

