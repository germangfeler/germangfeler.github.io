---
layout: default
---
{%- assign sec = page.taxonomy -%}
<section class="listing listing--{{ sec }}">
  <header class="listing__head">
    <h1 class="listing__title">{{ page.title }}</h1>
    <div class="listing__intro">{{ content }}</div>
    <p class="listing__count">{{ site.categories[sec].size }} posts</p>
  </header>
  <ol class="entries">
    {%- for post in site.categories[sec] -%}
      {% include entry.html post=post show_section=false %}
    {%- endfor -%}
  </ol>
</section>
