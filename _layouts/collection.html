---
layout: default
---
{%- assign docs = site[page.collection] | sort: 'path' -%}
<section class="listing">
  <header class="listing__head">
    <h1 class="listing__title">{{ page.title }}</h1>
    <div class="listing__intro">{{ content }}</div>
  </header>
  <ol class="entries">
    {%- for d in docs -%}
      {% include entry.html post=d show_section=false %}
    {%- endfor -%}
  </ol>
</section>
