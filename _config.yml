# Configuración del sitio
# Después de cambiar este archivo, reiniciá `bundle exec jekyll serve`.

title: "Germán A. González"
description: "Ciencia de datos, bioinformática, estadística y política científica."
url: "https://germangfeler.github.io"
baseurl: ""
lang: es
locale: es_AR

author:
  name: "Germán A. González"
  avatar: "/assets/img/retrato-tinta.jpg"
  location: "Córdoba, Argentina"
  twitter: germangfeler

# Links de contacto (aparecen en la portada y en el pie).
# icon: substack | scholar | linkedin | twitter | github | mail | cv | instagram
links:
  - label: "Substack"
    icon: substack
    url: "https://substack.com/@germangfeler"
  - label: "Google Scholar"
    icon: scholar
    url: "https://scholar.google.com/citations?user=fgD8CFYAAAAJ&hl=es"
  - label: "LinkedIn"
    icon: linkedin
    url: "https://www.linkedin.com/in/germanglz/"
  - label: "X / Twitter"
    icon: twitter
    url: "https://twitter.com/germangfeler"

# Secciones del blog. La clave coincide con `categories:` de cada post.
sections:
  datascience:
    title: "Data Science"
    url: /datascience/
  cafe:
    title: "Café"
    url: /cafe/

# Comentarios con Disqus (borrá el shortname para desactivarlos)
disqus_shortname: germangfeler

# Google Analytics 4: poné tu ID "G-XXXXXXX" para activarlo.
# (El ID viejo UA-129293475-1 dejó de funcionar en 2023.)
ga4_id:

# Para jekyll-seo-tag
twitter:
  username: germangfeler
social:
  name: "Germán A. González"
  links:
    - "https://substack.com/@germangfeler"
    - "https://twitter.com/germangfeler"
    - "https://www.linkedin.com/in/germanglz/"

words_per_minute: 200
timezone: America/Argentina/Cordoba

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
excerpt_separator: "\n\n"

permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jemoji

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .bundle

collections:
  cursos:
    output: true
    permalink: /:collection/:path/
  servicios:
    output: false   # se muestran desplegables dentro de /servicios/

defaults:
  # imagen que se muestra al compartir un link (los posts usan su miniatura)
  - scope:
      path: ""
    values:
      image: /assets/img/compartir.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      comments: true
      read_time: true
  - scope:
      path: ""
      type: cursos
    values:
      layout: single
  - scope:
      path: ""
      type: servicios
    values:
      layout: single
