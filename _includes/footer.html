<footer class="site-footer">
  <div class="site-footer__inner">
    <p>© {{ site.time | date: '%Y' }} {{ site.author.name }} · {{ site.author.location }}</p>
    <ul class="links">
      {%- for l in site.links -%}
      <li><a href="{{ l.url }}" rel="me noopener">{% include icon.html name=l.icon %}<span>{{ l.label }}</span></a></li>
      {%- endfor -%}
      <li><a href="{{ '/feed.xml' | relative_url }}">{% include icon.html name='rss' %}<span>RSS</span></a></li>
    </ul>
  </div>
</footer>
